    const COLOR_THEMES = {

    function roundToTwo(num) {
      return Math.round((Number(num) + Number.EPSILON) * 100) / 100;
    }

    function getLetterGradeInfo(percentage, cutoffs) {
      if (percentage === null || isNaN(percentage)) {
        return { letter: '—', color: 'text-slate-400', bg: 'bg-slate-800', nextGrade: null };
      }
      const sorted = [...cutoffs].sort((a, b) => b.min - a.min);
      let matchedIndex = sorted.findIndex((c) => percentage >= c.min);
      if (matchedIndex === -1) matchedIndex = sorted.length - 1;

      const current = sorted[matchedIndex];
      const nextUp = matchedIndex > 0 ? sorted[matchedIndex - 1] : null;

      let color = 'text-emerald-400';
      let bg = 'bg-emerald-500/15 border-emerald-500/30';
      if (current.grade.startsWith('B')) {
        color = 'text-indigo-400';
        bg = 'bg-indigo-500/15 border-indigo-500/30';
      } else if (current.grade.startsWith('C')) {
        color = 'text-amber-400';
        bg = 'bg-amber-500/15 border-amber-500/30';
      } else if (current.grade.startsWith('D') || current.grade === 'F') {
        color = 'text-rose-400';
        bg = 'bg-rose-500/15 border-rose-500/30';
      }

      return {
        letter: current.grade,
        min: current.min,
        color,
        bg,
        nextGrade: nextUp
      };
    }

    function App() {
      const [subjects, setSubjects] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.map((s) => ({
                ...s,
                usePointGuidelines: s.usePointGuidelines !== undefined ? s.usePointGuidelines : true
              }));
            }
          }
        } catch (err) {
          console.error('Failed loading saved gradebooks:', err);
        }
        return INITIAL_SUBJECTS;
      });

      const [activeSubjectId, setActiveSubjectId] = useState(() => subjects[0]?.id || INITIAL_SUBJECTS[0].id);
      const [categoryFilter, setCategoryFilter] = useState('All');

      // Modals / Drawers state
      const [isAddEntryOpen, setIsAddEntryOpen] = useState(false);
      const [editingEntry, setEditingEntry] = useState(null);
      const [isSubjectModalOpen, setIsSubjectModalOpen] = useState(false);
      const [subjectModalMode, setSubjectModalMode] = useState('create'); // 'create' | 'edit'
      const [isScaleModalOpen, setIsScaleModalOpen] = useState(false);
      const [isWhatIfOpen, setIsWhatIfOpen] = useState(false);
      const [confirmDeleteSubject, setConfirmDeleteSubject] = useState(false);

      // Entry Form State
      const [entryTitle, setEntryTitle] = useState('');
      const [entryCategory, setEntryCategory] = useState('Quiz');
      const [entryDate, setEntryDate] = useState(() => new Date().toISOString().split('T')[0]);

      // Inputs for the 3 calculation modes
      const [directEarned, setDirectEarned] = useState('');
      const [directMax, setDirectMax] = useState('30');
      const [percentInput, setPercentInput] = useState('');
      const [targetGuidelineMax, setTargetGuidelineMax] = useState('30');
      const [rawEarned, setRawEarned] = useState('');
      const [rawOutOf, setRawOutOf] = useState('');

      // Subject Form State
      const [subjName, setSubjName] = useState('');
      const [subjColor, setSubjColor] = useState('indigo');
      const [subjUse85, setSubjUse85] = useState(true);
      const [subjUseGuidelines, setSubjUseGuidelines] = useState(true);
      const [guidelineTest, setGuidelineTest] = useState('60');
      const [guidelineQuiz, setGuidelineQuiz] = useState('30');
      const [guidelineAssignment, setGuidelineAssignment] = useState('10');
      const [guidelineOther, setGuidelineOther] = useState('20');

      // What-If Calculator State
      const [whatIfCategory, setWhatIfCategory] = useState('Test');
      const [whatIfMaxPoints, setWhatIfMaxPoints] = useState('60');
      const [whatIfHypotheticalEarned, setWhatIfHypotheticalEarned] = useState('54');

      // Persist to localStorage automatically on any change
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(subjects));
        } catch (err) {
          console.error('Failed saving to localStorage:', err);
        }
      }, [subjects]);

      // Keep activeSubjectId valid if subjects change
      const activeSubject = useMemo(() => {
        return subjects.find((s) => s.id === activeSubjectId) || subjects[0] || null;
      }, [subjects, activeSubjectId]);

      const useGuidelinesActive = activeSubject ? Boolean(activeSubject.usePointGuidelines) : true;

      const saveSubjectToStore = (updatedSubject) => {
        setSubjects((prev) => {
          const exists = prev.some((s) => s.id === updatedSubject.id);
          if (exists) {
            return prev.map((s) => (s.id === updatedSubject.id ? updatedSubject : s));
          }
          return [...prev, updatedSubject];
        });
      };

      const deleteSubjectFromStore = (subjectId) => {
        const remaining = subjects.filter((s) => s.id !== subjectId);
        setSubjects(remaining);
        if (remaining.length > 0) {
          setActiveSubjectId(remaining[0].id);
        }
      };

      const stats = useMemo(() => {
        if (!activeSubject) return null;
        const entries = activeSubject.entries || [];

        let totalEarned = 0;
        let totalMax = 0;

        const byCategory = {
          Test: { earned: 0, max: 0, count: 0 },
          Quiz: { earned: 0, max: 0, count: 0 },
          Assignment: { earned: 0, max: 0, count: 0 },
          Other: { earned: 0, max: 0, count: 0 }
        };

        entries.forEach((e) => {
          const earned = Number(e.earnedPoints) || 0;
          const max = Number(e.maxPoints) || 0;
          totalEarned += earned;
          totalMax += max;
          const cat = byCategory[e.category] ? e.category : 'Other';
          byCategory[cat].earned += earned;
          byCategory[cat].max += max;
          byCategory[cat].count += 1;
        });

        const overallPercent = totalMax > 0 ? (totalEarned / totalMax) * 100 : null;
        const activeCutoffs =
          activeSubject.customCutoffs ||
          (activeSubject.use85Scale
            ? SCALE_PRESETS.shifted85.cutoffs
            : SCALE_PRESETS.standard90.cutoffs);

        const gradeInfo = getLetterGradeInfo(overallPercent, activeCutoffs);

        return {
          totalEarned: roundToTwo(totalEarned),
          totalMax: roundToTwo(totalMax),
          overallPercent: overallPercent !== null ? roundToTwo(overallPercent) : null,
          gradeInfo,
          byCategory,
          activeCutoffs
        };
      }, [activeSubject]);

      // Whenever category changes in the Add Entry modal, prefill the category's guideline max points ONLY if usePointGuidelines is checked
      const handleSelectEntryCategory = (cat) => {
        setEntryCategory(cat);

          const defaultPts = activeSubject?.guidelines?.[cat] ?? 30;
          setDirectMax(String(defaultPts));
          setTargetGuidelineMax(String(defaultPts));

      };

      const openNewEntryModal = (defaultCat = 'Quiz') => {
        if (!activeSubject) return;
        setEditingEntry(null);

        setEntryCategory(defaultCat);
        const guidelinePts = activeSubject.guidelines?.[defaultCat] ?? 30;

          setTargetGuidelineMax(String(guidelinePts));
        } else {

          setTargetGuidelineMax(String(guidelinePts));

        setRawOutOf('');
        setCalcMode('direct');

        setTargetGuidelineMax(String(entry.maxPoints));

        setRawEarned(String(entry.earnedPoints));
        setRawOutOf(String(entry.maxPoints));
        setIsAddEntryOpen(true);

      // Compute live preview of earned / max points inside the Add/Edit Grade modal
      const calculatedPreview = useMemo(() => {
        const effectiveMode = useGuidelinesActive ? calcMode : 'direct';

        if (effectiveMode === 'direct') {
          const e = parseFloat(directEarned);
          const m = parseFloat(directMax);
          if (isNaN(e) || isNaN(m) || m <= 0) return { valid: false };
          return {
            valid: true,
            earned: roundToTwo(e),
            max: roundToTwo(m),
            percent: roundToTwo((e / m) * 100),
            note: `Direct points (${roundToTwo(e)} / ${roundToTwo(m)} pts)`
          };
        }

        if (effectiveMode === 'percent') {
          const pct = parseFloat(percentInput);
          const m = parseFloat(targetGuidelineMax);
          if (isNaN(pct) || isNaN(m) || m <= 0) return { valid: false };
          const earned = (pct / 100) * m;
          return {
            valid: true,
            earned: roundToTwo(earned),
            max: roundToTwo(m),
            percent: roundToTwo(pct),
            note: `${roundToTwo(pct)}% converted to ${roundToTwo(m)}-pt ${entryCategory} guideline`
          };
        }

        if (effectiveMode === 'rescale') {
          const re = parseFloat(rawEarned);
          const rm = parseFloat(rawOutOf);
          const m = parseFloat(targetGuidelineMax);
          if (isNaN(re) || isNaN(rm) || rm <= 0 || isNaN(m) || m <= 0) return { valid: false };
          const scaledEarned = (re / rm) * m;
          return {
            valid: true,
            earned: roundToTwo(scaledEarned),
            max: roundToTwo(m),
            percent: roundToTwo((re / rm) * 100),
            note: `Rescaled from ${roundToTwo(re)} / ${roundToTwo(rm)} raw score to ${roundToTwo(m)} pts`
          };
        }

        return { valid: false };
      }, [
        useGuidelinesActive,
        calcMode,
        directEarned,
        directMax,
        percentInput,
        targetGuidelineMax,
        rawEarned,
        rawOutOf,
        entryCategory

      const handleSaveEntry = (e) => {
        e.preventDefault();
        if (!activeSubject || !calculatedPreview.valid) return;

          entryTitle.trim() ||

        const newEntryObj = {
          id: editingEntry ? editingEntry.id : `ent-${Date.now()}`,
          title: finalTitle,
          category: entryCategory,
          earnedPoints: calculatedPreview.earned,
          maxPoints: calculatedPreview.max,
          inputMode: useGuidelinesActive ? calcMode : 'direct',
          rawNote: calculatedPreview.note,
          date: entryDate

        const updatedEntries = editingEntry
          ? activeSubject.entries.map((item) => (item.id === editingEntry.id ? newEntryObj : item))
          : [newEntryObj, ...(activeSubject.entries || [])];

        saveSubjectToStore({
          ...activeSubject,
          entries: updatedEntries

        setIsAddEntryOpen(false);

        saveSubjectToStore({

                      <div

                            COLOR_THEMES[colorKey]
                          } flex items-center justify-center transition ${
                            subjColor === colorKey
                              ? 'ring-2 ring-white scale-105'
                              : 'opacity-60 hover:opacity-100'
                          }`}
                        >
                          {subjColor === colorKey && <Check className="w-5 h-5 text-white" />}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Checkbox to enable/disable Set Category Point Guidelines */}
                  <label className="p-4 rounded-2xl bg-slate-950 border border-slate-800 flex items-center gap-3.5 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={subjUseGuidelines}
                      onChange={(e) => setSubjUseGuidelines(e.target.checked)}
                      className="sr-only"
                    />
                    <div
                      className={`w-6 h-6 rounded-lg flex items-center justify-center border shrink-0 ${
                        subjUseGuidelines
                          ? 'bg-indigo-600 border-indigo-500 text-white'
                          : 'bg-slate-800 border-slate-700 text-transparent'
                      }`}
                    >
                      <Check className="w-4 h-4 stroke-[3]" />
                    </div>
                    <div className="text-xs">
                      <div className="font-bold text-white text-sm">
                        Enable Set Point Guidelines for Tests / Quizzes
                      </div>
                      <div className="text-slate-400 mt-0.5">
                        Uncheck if you prefer to manually enter points got and points out of for every item.
                      </div>
                    </div>
                  </label>

                  {/* Set Category Point Guidelines (Shown when enabled) */}
                  {subjUseGuidelines && (
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">
                        Default Category Point Guidelines
                      </label>
                      <p className="text-xs text-slate-400 mb-3">
                        For example, in Stats if all Quizzes are worth 30 pts and all Tests are worth 60
                        pts, set them here so any percentage or raw score automatically scales to them.
                      </p>
                      <div className="grid grid-cols-2 gap-3">
                        <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800">
                          <label className="block text-xs font-bold text-rose-400 mb-1">
                            Tests Worth (Pts)
                          </label>
                          <input
                            type="number"
                            step="any"
                            required
                            value={guidelineTest}
                            onChange={(e) => setGuidelineTest(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold"
                          />
                        </div>
                        <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800">
                          <label className="block text-xs font-bold text-indigo-400 mb-1">
                            Quizzes Worth (Pts)
                          </label>
                          <input
                            type="number"
                            step="any"
                            required
                            value={guidelineQuiz}
                            onChange={(e) => setGuidelineQuiz(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold"
                          />
                        </div>
                        <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800">
                          <label className="block text-xs font-bold text-emerald-400 mb-1">
                            Assignments Worth (Pts)
                          </label>
                          <input
                            type="number"
                            step="any"
                            required
                            value={guidelineAssignment}
                            onChange={(e) => setGuidelineAssignment(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold"
                          />
                        </div>
                        <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800">
                          <label className="block text-xs font-bold text-amber-400 mb-1">
                            Other Worth (Pts)
                          </label>
                          <input
                            type="number"
                            step="any"
                            required
                            value={guidelineOther}
                            onChange={(e) => setGuidelineOther(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 85% Scale Checkbox in Subject Modal */}
                  <label className="p-4 rounded-2xl bg-slate-950 border border-slate-800 flex items-center gap-3.5 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={subjUse85}
                      onChange={(e) => setSubjUse85(e.target.checked)}
                      className="sr-only"
                    />
                    <div
                      className={`w-6 h-6 rounded-lg flex items-center justify-center border shrink-0 ${
                        subjUse85
                          ? 'bg-indigo-600 border-indigo-500 text-white'
                          : 'bg-slate-800 border-slate-700 text-transparent'
                      }`}
                    >
                      <Check className="w-4 h-4 stroke-[3]" />
                    </div>
                    <div className="text-xs">
                      <div className="font-bold text-white text-sm">
                        Use 85% A- Grade Bounds (A- = 85%, B- = 75%, C- = 65%, D- = 55%)
                      </div>
                      <div className="text-slate-400 mt-0.5">
                        Uncheck to use standard 90% A- bounds (A- = 90%, B- = 80%, etc.)
                      </div>
                    </div>
                  </label>

                  <div className="flex items-center justify-between pt-3 border-t border-slate-800">
                    {subjectModalMode === 'edit' && subjects.length > 1 ? (
                      !confirmDeleteSubject ? (
                        <button
                          type="button"
                          onClick={() => setConfirmDeleteSubject(true)}
                          className="px-3.5 py-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-bold flex items-center gap-1.5"
                        >
                          <Trash2 className="w-4 h-4" /> Delete Subject
                        </button>
                      ) : (
                        <button
                          type="button"
                          onClick={() => {
                            deleteSubjectFromStore(activeSubject.id);
                            setIsSubjectModalOpen(false);
                          }}
                          className="px-3.5 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-bold"
                        >
                          Confirm Delete?
                        </button>
                      )
                    ) : (
                      <div />
                    )}

                    <div className="flex items-center gap-3">
                      <button
                        type="button"
                        onClick={() => setIsSubjectModalOpen(false)}
                        className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-sm font-semibold"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold shadow-lg shadow-indigo-600/25"
                      >
                        {subjectModalMode === 'create' ? 'Create Gradebook' : 'Save Settings'}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* SCALE CUTOFFS MODAL */}
          {isScaleModalOpen && activeSubject && stats && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 md:p-7 shadow-2xl space-y-5 my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div>
                    <h3 className="text-xl font-bold text-white">
                      Grade Bounds & Cutoffs ({activeSubject.name})
                    </h3>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Switch between the 85% A- scale and Standard 90% scale, or fine-tune any cutoff
                      below.
                    </p>
                  </div>
                  <button
                    onClick={() => setIsScaleModalOpen(false)}
                    className="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                {/* Preset Switch Buttons */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={() => handleToggle85Scale(true)}
                    className={`p-3.5 rounded-2xl border text-left transition ${
                      activeSubject.use85Scale
                        ? 'bg-indigo-600/20 border-indigo-500 text-white'
                        : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                    }`}
                  >
                    <div className="font-bold text-sm">85% A- Scale (10-pt bounds)</div>
                    <div className="text-xs opacity-80 mt-0.5">
                      A- = 85%, B- = 75%, C- = 65%, D- = 55%
                    </div>
                  </button>
                  <button
                    type="button"
                    onClick={() => handleToggle85Scale(false)}
                    className={`p-3.5 rounded-2xl border text-left transition ${
                      !activeSubject.use85Scale
                        ? 'bg-indigo-600/20 border-indigo-500 text-white'
                        : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                    }`}
                  >
                    <div className="font-bold text-sm">Standard 90% A- Scale</div>
                    <div className="text-xs opacity-80 mt-0.5">
                      A- = 90%, B- = 80%, C- = 70%, D- = 60%
                    </div>
                  </button>
                </div>

                {/* Editable Cutoffs Grid */}
                <div className="grid grid-cols-3 sm:grid-cols-4 gap-2.5 max-h-80 overflow-y-auto p-1">
                  {stats.activeCutoffs
                    .filter((c) => c.grade !== 'F')
                    .map((c) => (
                      <div
                        key={c.grade}
                        className="p-3 rounded-2xl bg-slate-950 border border-slate-800 flex flex-col justify-between"
                      >
                        <span className="text-xs font-extrabold text-indigo-400">{c.grade} Minimum %</span>
                        <div className="flex items-center gap-1 mt-1.5">
                          <input
                            type="number"
                            step="any"
                            value={c.min}
                            onChange={(e) => handleUpdateSingleCutoff(c.grade, e.target.value)}
                            className="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-white font-bold text-sm"
                          />
                          <span className="text-xs text-slate-400">%</span>
                        </div>
                      </div>
                    ))}
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setIsScaleModalOpen(false)}
                    className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* WHAT-IF CALCULATOR MODAL */}
          {isWhatIfOpen && activeSubject && stats && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 md:p-7 shadow-2xl space-y-6 my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div className="flex items-center gap-2.5">
                    <Sparkles className="w-6 h-6 text-amber-400" />
                    <div>
                      <h3 className="text-xl font-bold text-white">
                        What-If Grade Calculator ({activeSubject.name})
                      </h3>
                      <p className="text-xs text-slate-400">
                        See how an upcoming assessment impacts your overall course grade.
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsWhatIfOpen(false)}
                    className="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                {/* Quick Category Presets */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                  {(['Test', 'Quiz', 'Assignment', 'Other']).map((cat) => {
                    const pts = activeSubject.guidelines?.[cat] ?? 30;
                    const active = whatIfCategory === cat;
                    return (
                      <button
                        key={cat}
                        type="button"
                        onClick={() => {
                          setWhatIfCategory(cat);
                          setWhatIfMaxPoints(String(pts));
                          setWhatIfHypotheticalEarned(String(roundToTwo(pts * 0.9)));
                        }}
                        className={`p-3 rounded-2xl border text-left transition ${
                          active
                            ? 'bg-indigo-600 text-white border-indigo-500'
                            : 'bg-slate-950 border-slate-800 text-slate-300'
                        }`}
                      >
                        <div className="font-bold text-xs">Next {cat}</div>
                        <div className="text-sm font-extrabold mt-0.5">{pts} pts</div>
                      </button>
                    );
                  })}
                </div>

                {/* Hypothetical Score Input */}
                <div className="grid grid-cols-2 gap-4 p-4 rounded-2xl bg-slate-950 border border-slate-800">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1 font-medium">
                      Hypothetical Earned Points
                    </label>
                    <input
                      type="number"
                      step="any"
                      value={whatIfHypotheticalEarned}
                      onChange={(e) => setWhatIfHypotheticalEarned(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold text-lg"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1 font-medium">
                      Upcoming Max Points
                    </label>
                    <input
                      type="number"
                      step="any"
                      value={whatIfMaxPoints}
                      onChange={(e) => setWhatIfMaxPoints(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold text-lg"
                    />
                  </div>
                </div>

                {/* Projected Outcome */}
                {(() => {
                  const hypE = parseFloat(whatIfHypotheticalEarned) || 0;
                  const hypM = parseFloat(whatIfMaxPoints) || 0;
                  const newEarned = stats.totalEarned + hypE;
                  const newMax = stats.totalMax + hypM;
                  const newPct = newMax > 0 ? roundToTwo((newEarned / newMax) * 100) : null;
                  const newGrade = getLetterGradeInfo(newPct, stats.activeCutoffs);

                  return (
                    <div className="p-5 rounded-2xl bg-indigo-950/40 border border-indigo-500/30 flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-indigo-300">
                          Projected New Course Average
                        </span>
                        <div className="text-2xl font-black text-white mt-1">
                          {newPct !== null ? `${newPct}%` : '—'}{' '}
                          <span className="text-sm font-normal text-slate-300">
                            ({roundToTwo(newEarned)} / {roundToTwo(newMax)} pts)
                          </span>
                        </div>
                      </div>
                      <div
                        className={`w-16 h-16 rounded-2xl border flex items-center justify-center text-2xl font-black ${newGrade.bg} ${newGrade.color}`}
                      >
                        {newGrade.letter}
                      </div>
                    </div>
                  );
                })()}

                {/* Target Score Table for A+, A, A-, B+, B, B- */}
                <div>
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5">
                    Points Needed on This {whatIfMaxPoints}-Pt {whatIfCategory} to Reach Target Grade:
                  </h4>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                    {stats.activeCutoffs
                      .filter((c) => ['A+', 'A', 'A-', 'B+', 'B', 'B-'].includes(c.grade))
                      .map((c) => {
                        const hypM = parseFloat(whatIfMaxPoints) || 0;
                        const newTotalMax = stats.totalMax + hypM;
                        const requiredTotalEarned = (c.min / 100) * newTotalMax;
                        const neededOnNext = roundToTwo(requiredTotalEarned - stats.totalEarned);
                        const neededPct = hypM > 0 ? roundToTwo((neededOnNext / hypM) * 100) : 0;

                        return (
                          <div
                            key={c.grade}
                            className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex flex-col justify-between"
                          >
                            <div className="flex items-center justify-between">
                              <span className="font-extrabold text-white text-sm">{c.grade}</span>
                              <span className="text-xs text-slate-400">({c.min}%)</span>
                            </div>
                            <div className="mt-1.5">
                              {neededOnNext <= 0 ? (
                                <span className="text-xs font-bold text-emerald-400">
                                  0 / {hypM} pts (Guaranteed)
                                </span>
                              ) : neededOnNext > hypM ? (
                                <span className="text-xs font-semibold text-amber-400">
                                  {neededOnNext} / {hypM} pts ({neededPct}%)
                                </span>
                              ) : (
                                <span className="text-xs font-bold text-indigo-300">
                                  {neededOnNext} / {hypM} pts ({neededPct}%)
                                </span>
                              )}
                            </div>
                          </div>
                        );
                      })}
                  </div>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => setIsWhatIfOpen(false)}
                    className="px-6 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm"
                  >
                    Close Calculator
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
