    function roundToTwo(num) {
      return Math.round((Number(num) + Number.EPSILON) * 100) / 100;
    }

    function getLetterGradeInfo(percentage, cutoffs) {
      if (percentage === null || isNaN(percentage)) {
        return { letter: '—', color: 'text-slate-400', bg: 'bg-slate-800', nextGrade: null };
      }
      const sorted = [...cutoffs].sort((a, b) => b.min - a.min);
      let matchedIndex = sorted.findIndex((c) => percentage >= c.min);
      if (matchedIndex === -1) matchedIndex = sorted.length - 1;

      const current = sorted[matchedIndex];
      const nextUp = matchedIndex > 0 ? sorted[matchedIndex - 1] : null;

      let color = 'text-emerald-400';
      let bg = 'bg-emerald-500/15 border-emerald-500/30';
      if (current.grade.startsWith('B')) {
        color = 'text-indigo-400';
        bg = 'bg-indigo-500/15 border-indigo-500/30';
      } else if (current.grade.startsWith('C')) {
        color = 'text-amber-400';
        bg = 'bg-amber-500/15 border-amber-500/30';
      } else if (current.grade.startsWith('D') || current.grade === 'F') {
        color = 'text-rose-400';
        bg = 'bg-rose-500/15 border-rose-500/30';
      }

      return {
        letter: current.grade,
        min: current.min,
        color,
        bg,
        nextGrade: nextUp
      };
    }

    function calculateSubjectStanding(subj) {
      if (!subj) return null;
      const entries = subj.entries || [];

      let totalEarned = 0;
      let totalMax = 0;

      const byCategory = {
        Test: { earned: 0, max: 0, count: 0 },
        Quiz: { earned: 0, max: 0, count: 0 },
        Assignment: { earned: 0, max: 0, count: 0 },
        Other: { earned: 0, max: 0, count: 0 }
      };

      entries.forEach((e) => {
        const earned = Number(e.earnedPoints) || 0;
        const max = Number(e.maxPoints) || 0;
        totalEarned += earned;
        totalMax += max;
        const cat = byCategory[e.category] ? e.category : 'Other';
        byCategory[cat].earned += earned;
        byCategory[cat].max += max;
        byCategory[cat].count += 1;
      });

      const objectivePercent = totalMax > 0 ? (totalEarned / totalMax) * 100 : null;

      const assessmentsEarned =
        byCategory.Test.earned + byCategory.Quiz.earned + byCategory.Other.earned;
      const assessmentsMax =
        byCategory.Test.max + byCategory.Quiz.max + byCategory.Other.max;
      const assessmentsCount =
        byCategory.Test.count + byCategory.Quiz.count + byCategory.Other.count;
      const assessmentsPct =
        assessmentsMax > 0 ? (assessmentsEarned / assessmentsMax) * 100 : null;

      const takeHomeEarned = byCategory.Assignment.earned;
      const takeHomeMax = byCategory.Assignment.max;
      const takeHomeCount = byCategory.Assignment.count;
      const takeHomePct = takeHomeMax > 0 ? (takeHomeEarned / takeHomeMax) * 100 : null;

      const hasEffl =
        subj.efflPercent !== '' &&
        subj.efflPercent !== null &&
        subj.efflPercent !== undefined &&
        !isNaN(Number(subj.efflPercent));
      const efflPct = hasEffl ? Number(subj.efflPercent) : null;

      const wAssess = Number(subj.weights?.Assessments ?? 85);
      const wAssign = Number(subj.weights?.Assignment ?? 10);
      const wEffl = Number(subj.weights?.EFFL ?? 5);

      let weightedSum = 0;
      let activeWeightTotal = 0;

      if (assessmentsPct !== null) {
        weightedSum += assessmentsPct * wAssess;
        activeWeightTotal += wAssess;
      }
      if (takeHomePct !== null) {
        weightedSum += takeHomePct * wAssign;
        activeWeightTotal += wAssign;
      }
      if (efflPct !== null) {
        weightedSum += efflPct * wEffl;
        activeWeightTotal += wEffl;
      }

      const weightedPercent =
        activeWeightTotal > 0 ? weightedSum / activeWeightTotal : null;

      const displayPercent = subj.useWeightedView ? weightedPercent : objectivePercent;

      const activeCutoffs =
        subj.customCutoffs ||
        (subj.use85Scale
          ? SCALE_PRESETS.shifted85.cutoffs
          : SCALE_PRESETS.standard90.cutoffs);

      const gradeInfo = getLetterGradeInfo(
        displayPercent !== null ? roundToTwo(displayPercent) : null,
        activeCutoffs
      );

      return {
        totalEarned: roundToTwo(totalEarned),
        totalMax: roundToTwo(totalMax),
        objectivePercent: objectivePercent !== null ? roundToTwo(objectivePercent) : null,
        weightedPercent: weightedPercent !== null ? roundToTwo(weightedPercent) : null,
        overallPercent: displayPercent !== null ? roundToTwo(displayPercent) : null,
        assessmentsEarned: roundToTwo(assessmentsEarned),
        assessmentsMax: roundToTwo(assessmentsMax),
        assessmentsCount,
        assessmentsPct: assessmentsPct !== null ? roundToTwo(assessmentsPct) : null,
        takeHomeEarned: roundToTwo(takeHomeEarned),
        takeHomeMax: roundToTwo(takeHomeMax),
        takeHomeCount,
        takeHomePct: takeHomePct !== null ? roundToTwo(takeHomePct) : null,
        efflPct: efflPct !== null ? roundToTwo(efflPct) : null,
        weights: { Assessments: wAssess, Assignment: wAssign, EFFL: wEffl },
        activeWeightTotal,
        gradeInfo,
        byCategory,
        activeCutoffs
      };
    }

      const [percentInput, setPercentInput] = useState('');
      const [targetGuidelineMax, setTargetGuidelineMax] = useState('30');
      const [rawEarned, setRawEarned] = useState('');
      const [rawOutOf, setRawOutOf] = useState('');

      // Subject Form State
      const [subjName, setSubjName] = useState('');
      const [subjColor, setSubjColor] = useState('indigo');
      const [subjUse85, setSubjUse85] = useState(true);
      const [subjUseGuidelines, setSubjUseGuidelines] = useState(true);
      const [subjUseWeighted, setSubjUseWeighted] = useState(true);
      const [guidelineTest, setGuidelineTest] = useState('60');
      const [guidelineQuiz, setGuidelineQuiz] = useState('30');
      const [guidelineAssignment, setGuidelineAssignment] = useState('10');

      // What-If Calculator State
      const [whatIfCategory, setWhatIfCategory] = useState('Test');
      const [whatIfMaxPoints, setWhatIfMaxPoints] = useState('60');
      const [whatIfHypotheticalEarned, setWhatIfHypotheticalEarned] = useState('54');

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(subjects));
        } catch (err) {
          console.error('Failed saving to localStorage:', err);
        }
      }, [subjects]);

      const activeSubject = useMemo(() => {
        return subjects.find((s) => s.id === activeSubjectId) || subjects[0] || null;
      }, [subjects, activeSubjectId]);

      const useGuidelinesActive = activeSubject ? Boolean(activeSubject.usePointGuidelines) : true;
      const isOtherUnscaledCategory = entryCategory === 'Other';
      const shouldAutoScaleCurrentEntry = useGuidelinesActive && !isOtherUnscaledCategory;

      const saveSubjectToStore = (updatedSubject) => {
        setSubjects((prev) => {
          const exists = prev.some((s) => s.id === updatedSubject.id);
          if (exists) {
            return prev.map((s) => (s.id === updatedSubject.id ? updatedSubject : s));
          }
          return [...prev, updatedSubject];
        });
      };

      const deleteSubjectFromStore = (subjectId) => {
        const remaining = subjects.filter((s) => s.id !== subjectId);
        setSubjects(remaining);
        if (remaining.length > 0) {
          setActiveSubjectId(remaining[0].id);
        }
      };

      const stats = useMemo(() => calculateSubjectStanding(activeSubject), [activeSubject]);

      const handleSelectEntryCategory = (cat) => {
        setEntryCategory(cat);
        if (cat === 'Other') {
          setCalcMode('direct');
          setDirectMax('');
          return;
        }
        if (activeSubject?.usePointGuidelines) {
          const defaultPts = activeSubject?.guidelines?.[cat] ?? (cat === 'Test' ? 60 : cat === 'Quiz' ? 30 : 10);
          setDirectMax(String(defaultPts));
          setTargetGuidelineMax(String(defaultPts));
        } else {
          setDirectMax('');
        }
      };

      const openNewEntryModal = (defaultCat = 'Quiz') => {
        if (!activeSubject) return;
        setEditingEntry(null);
        setEntryTitle('');
        setEntryCategory(defaultCat);
        const guidelinePts =
          activeSubject.guidelines?.[defaultCat] ??
          (defaultCat === 'Test' ? 60 : defaultCat === 'Quiz' ? 30 : 10);
        setDirectEarned('');
        if (activeSubject.usePointGuidelines && defaultCat !== 'Other') {
          setDirectMax(String(guidelinePts));
          setTargetGuidelineMax(String(guidelinePts));
        } else {
          setDirectMax('');
          setTargetGuidelineMax(String(guidelinePts));
        }
        setPercentInput('');
        setRawEarned('');
        setRawOutOf('');
        setCalcMode('direct');
        setEntryDate(new Date().toISOString().split('T')[0]);
        setIsAddEntryOpen(true);
      };

      const openEditEntryModal = (entry) => {
        if (!activeSubject) return;
        setEditingEntry(entry);
        setEntryTitle(entry.title);
        setEntryCategory(entry.category || 'Quiz');
        setEntryDate(entry.date || new Date().toISOString().split('T')[0]);
        setCalcMode('direct');
        setDirectEarned(String(entry.earnedPoints));
        setDirectMax(String(entry.maxPoints));
        setTargetGuidelineMax(String(entry.maxPoints));
        const pct = entry.maxPoints > 0 ? roundToTwo((entry.earnedPoints / entry.maxPoints) * 100) : '';
        setPercentInput(String(pct));
        setRawEarned(String(entry.earnedPoints));
        setRawOutOf(String(entry.maxPoints));
        setIsAddEntryOpen(true);
      };

      const calculatedPreview = useMemo(() => {
        const effectiveMode = shouldAutoScaleCurrentEntry ? calcMode : 'direct';
        const isAssessmentCat = entryCategory === 'Test' || entryCategory === 'Quiz';
        const catTag = isAssessmentCat
          ? `${entryCategory} • Assessment`
          : entryCategory === 'Assignment'
          ? 'Take-Home / Reading Check'
          : 'Other (Unscaled)';

        if (effectiveMode === 'direct') {
          const e = parseFloat(directEarned);
          const m = parseFloat(directMax);
          if (isNaN(e) || isNaN(m) || m <= 0) return { valid: false };
          return {
            valid: true,
            earned: roundToTwo(e),
            max: roundToTwo(m),
            percent: roundToTwo((e / m) * 100),
            note: `${catTag} (${roundToTwo(e)} / ${roundToTwo(m)} pts)`
          };
        }

        if (effectiveMode === 'percent') {
          const pct = parseFloat(percentInput);
          const m = parseFloat(targetGuidelineMax);
          if (isNaN(pct) || isNaN(m) || m <= 0) return { valid: false };
          const earned = (pct / 100) * m;
          return {
            valid: true,
            earned: roundToTwo(earned),
            max: roundToTwo(m),
            percent: roundToTwo(pct),
            note: `${roundToTwo(pct)}% scaled to ${roundToTwo(m)}-pt ${catTag}`
          };
        }

        if (effectiveMode === 'rescale') {
          const re = parseFloat(rawEarned);
          const rm = parseFloat(rawOutOf);
          const m = parseFloat(targetGuidelineMax);
          if (isNaN(re) || isNaN(rm) || rm <= 0 || isNaN(m) || m <= 0) return { valid: false };
          const scaledEarned = (re / rm) * m;
          return {
            valid: true,
            earned: roundToTwo(scaledEarned),
            max: roundToTwo(m),
            percent: roundToTwo((re / rm) * 100),
            note: `Rescaled ${roundToTwo(re)}/${roundToTwo(rm)} to ${roundToTwo(m)}-pt ${catTag}`
          };
        }

        return { valid: false };
      }, [
        shouldAutoScaleCurrentEntry,
        calcMode,
        directEarned,
        directMax,
        percentInput,
        targetGuidelineMax,
        rawEarned,
        rawOutOf,
        entryCategory
      ]);

      const handleSaveEntry = (e) => {
        e.preventDefault();
        if (!activeSubject || !calculatedPreview.valid) return;

        const defaultBaseName =
          entryCategory === 'Assignment'
            ? 'Take-Home / Reading Check'
            : entryCategory;

        const finalTitle =
          entryTitle.trim() ||
          `${defaultBaseName} #${(activeSubject.entries?.filter((x) => x.category === entryCategory).length || 0) + 1}`;

        const newEntryObj = {
          id: editingEntry ? editingEntry.id : `ent-${Date.now()}`,
          title: finalTitle,
          category: entryCategory,
          earnedPoints: calculatedPreview.earned,
          maxPoints: calculatedPreview.max,
          inputMode: shouldAutoScaleCurrentEntry ? calcMode : 'direct',
          rawNote: calculatedPreview.note,
          date: entryDate
        };

        const updatedEntries = editingEntry
          ? activeSubject.entries.map((item) => (item.id === editingEntry.id ? newEntryObj : item))
          : [newEntryObj, ...(activeSubject.entries || [])];

        saveSubjectToStore({
          ...activeSubject,
          entries: updatedEntries
        });

        setIsAddEntryOpen(false);
      };

      const handleDeleteEntry = (entryId) => {
        if (!activeSubject) return;
        const updatedEntries = activeSubject.entries.filter((item) => item.id !== entryId);
        saveSubjectToStore({
          ...activeSubject,
          entries: updatedEntries
        });
      };

      const handleToggle85Scale = (checked) => {
        if (!activeSubject) return;
        const newCutoffs = checked
          ? JSON.parse(JSON.stringify(SCALE_PRESETS.shifted85.cutoffs))
          : JSON.parse(JSON.stringify(SCALE_PRESETS.standard90.cutoffs));

        saveSubjectToStore({
          ...activeSubject,
          use85Scale: checked,
          customCutoffs: newCutoffs
        });
      };

      const handleTogglePointGuidelines = (checked) => {
        if (!activeSubject) return;
        saveSubjectToStore({
          ...activeSubject,
          usePointGuidelines: checked
        });
        if (!checked) {
          setCalcMode('direct');
          if (entryCategory === 'Other') {
            setEntryCategory('Quiz');
          }
        } else if (entryCategory !== 'Other') {
          const defaultPts = activeSubject.guidelines?.[entryCategory] ?? 30;
          if (!directMax) setDirectMax(String(defaultPts));
          setTargetGuidelineMax(String(defaultPts));
        }
      };

      const handleToggleWeightedView = (checked) => {
        if (!activeSubject) return;
        saveSubjectToStore({
          ...activeSubject,
          useWeightedView: checked
        });
      };

      const handleEfflChange = (val) => {
        if (!activeSubject) return;
        saveSubjectToStore({
          ...activeSubject,
          efflPercent: val === '' ? '' : Number(val)
        });
      };

      const handleUpdateSingleCutoff = (gradeLabel, newMinVal) => {
        if (!activeSubject) return;
        const parsed = parseFloat(newMinVal);
        if (isNaN(parsed)) return;
        const updated = (activeSubject.customCutoffs || []).map((c) =>
          c.grade === gradeLabel ? { ...c, min: parsed } : c
        );
        saveSubjectToStore({
          ...activeSubject,
          customCutoffs: updated
        });
      };

      const openCreateSubjectModal = () => {
        setSubjectModalMode('create');
        setSubjName('');
        setSubjColor('indigo');
        setSubjUse85(true);
        setSubjUseGuidelines(true);
        setSubjUseWeighted(true);
        setGuidelineTest('60');
        setGuidelineQuiz('30');
        setGuidelineAssignment('10');
        setConfirmDeleteSubject(false);
        setIsSubjectModalOpen(true);
      };

      const openEditSubjectModal = () => {
        if (!activeSubject) return;
        setSubjectModalMode('edit');
        setSubjName(activeSubject.name);
        setSubjColor(activeSubject.iconColor || 'indigo');
        setSubjUse85(Boolean(activeSubject.use85Scale));
        setSubjUseGuidelines(Boolean(activeSubject.usePointGuidelines));
        setSubjUseWeighted(Boolean(activeSubject.useWeightedView));
        setGuidelineTest(String(activeSubject.guidelines?.Test ?? 60));
        setGuidelineQuiz(String(activeSubject.guidelines?.Quiz ?? 30));
        setGuidelineAssignment(String(activeSubject.guidelines?.Assignment ?? 10));
        setConfirmDeleteSubject(false);
        setIsSubjectModalOpen(true);
      };

      const handleSaveSubject = (e) => {
        e.preventDefault();
        const cleanName = subjName.trim() || 'Untitled Math Class';
        const newGuidelines = {
          Test: Math.max(1, parseFloat(guidelineTest) || 60),
          Quiz: Math.max(1, parseFloat(guidelineQuiz) || 30),
          Assignment: Math.max(1, parseFloat(guidelineAssignment) || 10)
        };

        if (subjectModalMode === 'create') {
          const newSubj = {
            id: `subj-${Date.now()}`,
            name: cleanName,
            iconColor: subjColor,
            use85Scale: subjUse85,
            usePointGuidelines: subjUseGuidelines,
            useWeightedView: subjUseWeighted,
            efflPercent: 100,
            weights: { Assessments: 85, Assignment: 10, EFFL: 5 },
            customCutoffs: JSON.parse(
              JSON.stringify(
                subjUse85 ? SCALE_PRESETS.shifted85.cutoffs : SCALE_PRESETS.standard90.cutoffs
              )
            ),
            guidelines: newGuidelines,
            entries: []
          };
          saveSubjectToStore(newSubj);
          setActiveSubjectId(newSubj.id);
        } else if (activeSubject) {
          const scaleChanged = activeSubject.use85Scale !== subjUse85;
          saveSubjectToStore({
            ...activeSubject,
            name: cleanName,
            iconColor: subjColor,
            use85Scale: subjUse85,
            usePointGuidelines: subjUseGuidelines,
            useWeightedView: subjUseWeighted,
            customCutoffs: scaleChanged
              ? JSON.parse(
                  JSON.stringify(
                    subjUse85 ? SCALE_PRESETS.shifted85.cutoffs : SCALE_PRESETS.standard90.cutoffs
                  )
                )
              : activeSubject.customCutoffs,
            guidelines: newGuidelines
          });
        }

        setIsSubjectModalOpen(false);
      };

      const filteredEntries = useMemo(() => {
        if (!activeSubject?.entries) return [];
        if (categoryFilter === 'All') return activeSubject.entries;
        if (categoryFilter === 'Assessments') {
          return activeSubject.entries.filter((e) => e.category === 'Test' || e.category === 'Quiz');
        }
        return activeSubject.entries.filter((e) => e.category === categoryFilter);
      }, [activeSubject, categoryFilter]);

      const modalCategoryOptions = useMemo(() => {
        const base = ['Test', 'Quiz', 'Assignment'];
        if (useGuidelinesActive || entryCategory === 'Other') {
          base.push('Other');
        }
        return base;
      }, [useGuidelinesActive, entryCategory]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col md:flex-row font-sans selection:bg-indigo-500 selection:text-white">
          {/* LEFT SIDEBAR */}
          <aside className="w-full md:w-72 lg:w-80 bg-slate-900/90 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col shrink-0">
            <div className="p-5 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/25">
                  <Calculator className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-tight text-white leading-tight">
                    GradePoint Pro
                  </h1>
                  <div className="flex items-center gap-1.5 text-xs text-slate-400">
                    <Cloud className="w-3.5 h-3.5 text-emerald-400" />
                    <span>Saved on Device</span>
                  </div>
                </div>
              </div>

              <button
                onClick={openCreateSubjectModal}
                title="New Subject Gradebook"
                className="p-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white transition flex items-center justify-center shadow-md shadow-indigo-600/20"
              >
                <FolderPlus className="w-5 h-5" />
              </button>
            </div>

            <div className="p-3 md:p-4 flex md:flex-col gap-2.5 overflow-x-auto md:overflow-y-auto flex-1">
              <div className="hidden md:flex items-center justify-between px-2 mb-1">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                  Your Subjects ({subjects.length})
                </span>
              </div>

              {subjects.map((subj) => {
                const isActive = subj.id === activeSubject?.id;
                const subjStanding = calculateSubjectStanding(subj);
                const pct = subjStanding?.overallPercent ?? null;
                const letterObj = subjStanding?.gradeInfo || {
                  letter: '—',
                  bg: 'bg-slate-800',
                  color: 'text-slate-400'
                };

                return (
                  <button
                    key={subj.id}
                    onClick={() => setActiveSubjectId(subj.id)}
                    className={`group relative flex items-center justify-between gap-3 px-4 py-3.5 rounded-2xl text-left transition-all shrink-0 md:shrink min-w-[215px] md:min-w-0 border ${
                      isActive
                        ? 'bg-slate-800/95 border-indigo-500/50 shadow-lg shadow-slate-950/50'
                        : 'bg-slate-900/40 hover:bg-slate-800/50 border-slate-800/80 text-slate-300'
                    }`}
                  >
                    <div className="flex items-center gap-3 min-w-0">
                      <div
                        className={`w-3 h-10 rounded-full bg-gradient-to-b ${
                          COLOR_THEMES[subj.iconColor] || COLOR_THEMES.indigo
                        }`}
                      />
                      <div className="min-w-0">
                        <div className="font-semibold text-sm md:text-base text-white truncate">
                          {subj.name}
                        </div>
                        <div className="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5 truncate">
                          <span>{subj.entries?.length || 0} items</span>
                          <span>•</span>
                          <span>{subj.useWeightedView ? 'AP Stats Weighted (85/10/5)' : 'Objective %'}</span>
                        </div>
                      </div>
                    </div>

                    <div className="text-right shrink-0">
                      <span
                        className={`inline-block px-2.5 py-1 rounded-lg text-xs font-bold border ${letterObj.bg} ${letterObj.color}`}
                      >
                        {letterObj.letter}
                      </span>
                      {pct !== null && (
                        <div className="text-xs text-slate-400 mt-1 font-medium">{pct}%</div>
                      )}
                    </div>
                  </button>
                );
              })}
            </div>

            {activeSubject && (
              <div className="hidden md:block p-4 m-4 rounded-2xl bg-slate-950/80 border border-slate-800/90 space-y-2.5">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                    Syllabus Weights
                  </span>
                  <button
                    onClick={openEditSubjectModal}
                    className="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1"
                  >
                    <Edit3 className="w-3 h-3" /> Edit
                  </button>
                </div>
                <div className="space-y-1.5 text-xs text-slate-300">
                  <div className="flex items-center justify-between p-2 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-rose-400 font-bold">Assessments</span>
                    <span className="font-bold text-white">85%</span>
                  </div>
                  <div className="flex items-center justify-between p-2 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-emerald-400 font-bold">Take-Home &amp; RC</span>
                    <span className="font-bold text-white">10%</span>
                  </div>
                  <div className="flex items-center justify-between p-2 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-amber-400 font-bold">EFFL</span>
                    <span className="font-bold text-white">5%</span>
                  </div>
                </div>
              </div>
            )}
          </aside>

          {/* MAIN CONTENT AREA */}
          {activeSubject && stats ? (
            <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
              <header className="p-5 md:p-7 border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-md sticky top-0 z-20">
                <div className="max-w-6xl mx-auto flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                  <div>
                    <div className="flex items-center gap-3 flex-wrap">
                      <h2 className="text-2xl md:text-3xl font-extrabold text-white tracking-tight">
                        {activeSubject.name}
                      </h2>
                      <button
                        onClick={openEditSubjectModal}
                        className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium flex items-center gap-1.5 transition"
                      >
                        <Settings className="w-3.5 h-3.5" />
                        Subject &amp; Point Settings
                      </button>
                    </div>
                    <p className="text-sm text-slate-400 mt-1">
                      Assessments: <strong className="text-rose-300">Test</strong> ({activeSubject.guidelines?.Test} pts) •{' '}
                      <strong className="text-indigo-300">Quiz</strong> ({activeSubject.guidelines?.Quiz} pts) •{' '}
                      <strong className="text-emerald-300">Take-Home &amp; Reading Checks</strong> (~10%) •{' '}
                      <strong className="text-amber-300">EFFL</strong> (~5%)
                    </p>
                  </div>

                  <div className="flex items-center gap-3 flex-wrap">
                    <button
                      onClick={() => {
                        setWhatIfCategory('Test');
                        setWhatIfMaxPoints(String(activeSubject.guidelines?.Test || 60));
                        setWhatIfHypotheticalEarned(
                          String(Math.round((activeSubject.guidelines?.Test || 60) * 0.9))
                        );
                        setIsWhatIfOpen(true);
                      }}
                      className="px-4 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-semibold text-sm flex items-center gap-2 border border-slate-700 transition"
                    >
                      <Sparkles className="w-4 h-4 text-amber-400" />
                      <span>What-If Calculator</span>
                    </button>

                    <button
                      onClick={() => openNewEntryModal('Quiz')}
                      className="px-5 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold text-sm flex items-center gap-2 shadow-lg shadow-indigo-600/30 transition"
                    >
                      <Plus className="w-5 h-5" />
                      <span>Add Grade</span>
                    </button>
                  </div>
                </div>
              </header>

              <div className="p-5 md:p-7 max-w-6xl w-full mx-auto space-y-6 flex-1">
                {/* GRADE CALCULATION VIEW MODE TOGGLE (AP Stats Weighted 85/10/5 vs Objective Percentage) */}
                <div className="space-y-3">
                  <div className="p-4 md:p-5 rounded-2xl bg-slate-900/90 border border-slate-800 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                    <div className="flex items-start sm:items-center gap-3.5">
                      <div className="w-10 h-10 rounded-2xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-400 shrink-0">
                        <Layers className="w-5 h-5" />
                      </div>
                      <div>
                        <div className="font-semibold text-white text-sm md:text-base flex items-center gap-2 flex-wrap">
                          <span>Grade Calculation View</span>
                          <span
                            className={`text-xs px-2.5 py-0.5 rounded-md font-bold ${
                              activeSubject.useWeightedView
                                ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'
                                : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                            }`}
                          >
                            {activeSubject.useWeightedView
                              ? 'AP Stats Weighted (85% / 10% / 5%) Active'
                              : 'Overall Objective Percentage Active'}
                          </span>
                        </div>
                        <p className="text-xs md:text-sm text-slate-400 mt-0.5">
                          {activeSubject.useWeightedView
                            ? 'Semester grade uses your exact AP Stats syllabus weights: Assessments (~85%), Take-Home & Reading Checks (~10%), and EFFL (~5%).'
                            : 'Calculates your overall objective percentage purely from total points earned divided by total max points.'}
                        </p>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-1.5 p-1.5 rounded-2xl bg-slate-950 border border-slate-800 shrink-0">
                      <button
                        type="button"
                        onClick={() => handleToggleWeightedView(true)}
                        className={`px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${
                          activeSubject.useWeightedView
                            ? 'bg-indigo-600 text-white shadow'
                            : 'text-slate-400 hover:text-white'
                        }`}
                      >
                        AP Stats Weighted (85/10/5)
                      </button>
                      <button
                        type="button"
                        onClick={() => handleToggleWeightedView(false)}
                        className={`px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${
                          !activeSubject.useWeightedView
                            ? 'bg-indigo-600 text-white shadow'
                            : 'text-slate-400 hover:text-white'
                        }`}
                      >
                        Objective Percentage
                      </button>
                    </div>
                  </div>

                  {/* 85% Scale Toggle */}
                  <div className="p-4 md:p-5 rounded-2xl bg-slate-900/90 border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <label className="flex items-start sm:items-center gap-3.5 cursor-pointer select-none">
                      <input
                        type="checkbox"
                        checked={Boolean(activeSubject.use85Scale)}
                        onChange={(e) => handleToggle85Scale(e.target.checked)}
                        className="sr-only"
                      />
                      <div
                        className={`w-7 h-7 rounded-xl flex items-center justify-center border transition shrink-0 mt-0.5 sm:mt-0 ${
                          activeSubject.use85Scale
                            ? 'bg-indigo-600 border-indigo-500 text-white shadow-md shadow-indigo-600/30'
                            : 'bg-slate-800 border-slate-700 text-transparent'
                        }`}
                      >
                        <Check className="w-4 h-4 stroke-[3]" />
                      </div>
                      <div>
                        <div className="font-semibold text-white text-sm md:text-base flex items-center gap-2 flex-wrap">
                          <span>Use 85% A- Grade Bounds (10-Point Bounds Starting at 85%)</span>
                          <span

                        2. How do you want to input the score? (Scales out of {targetGuidelineMax} pts)
                      </label>
                      <div className="grid grid-cols-3 gap-2 p-1.5 rounded-2xl bg-slate-950 border border-slate-800">
                        <button
                          type="button"
                          onClick={() => setCalcMode('direct')}
                          className={`py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                            calcMode === 'direct' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          <Hash className="w-3.5 h-3.5" />
                          <span>Direct Points</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => setCalcMode('percent')}
                          className={`py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                            calcMode === 'percent' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          <Percent className="w-3.5 h-3.5" />
                          <span>% to {targetGuidelineMax} Pts</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => setCalcMode('rescale')}
                          className={`py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                            calcMode === 'rescale' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          <RefreshCw className="w-3.5 h-3.5" />
                          <span>Rescale Raw Score</span>
                        </button>
                      </div>
                    </div>
                  )}

                  {(!shouldAutoScaleCurrentEntry || calcMode === 'direct') && (
                    <div className="p-4 rounded-2xl bg-slate-950/90 border border-slate-800 space-y-3">
                      <div className="text-xs text-slate-400">
                        {isOtherUnscaledCategory ? (
                          <>
                            <strong className="text-amber-300">Other (Unscaled Category):</strong> Enter both the points earned and the exact points it was out of.
                          </>
                        ) : (
                          <>
                            <strong className="text-slate-200">{entryCategory}:</strong> Max points is pre-filled to scale out of <strong className="text-white">{activeSubject.guidelines?.[entryCategory]} pts</strong>.
                          </>
                        )}
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1 font-medium">Points Got (Earned)</label>
                          <input
                            type="number"
                            step="any"
                            required
                            placeholder="e.g., 27.5"
                            value={directEarned}
                            onChange={(e) => setDirectEarned(e.target.value)}
                            className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-lg font-bold focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1 font-medium">
                            {shouldAutoScaleCurrentEntry ? `Scale Out Of (${entryCategory} Guideline)` : 'Points Out Of (Max)'}
                          </label>
                          <input
                            type="number"
                            step="any"
                            required
                            placeholder="e.g., 30"
                            value={directMax}
                            onChange={(e) => setDirectMax(e.target.value)}
                            className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-lg font-bold focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {shouldAutoScaleCurrentEntry && calcMode === 'percent' && (
                    <div className="p-4 rounded-2xl bg-slate-950/90 border border-slate-800 space-y-3">
                      <div className="text-xs text-slate-400">
                        Enter your percentage score (e.g., <strong className="text-white">92%</strong>) and it automatically scales it out of <strong className="text-white">{targetGuidelineMax} points</strong>.
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1 font-medium">Percentage Score (%)</label>
                          <input
                            type="number"
                            step="any"
                            required
                            placeholder="e.g., 92"
                            value={percentInput}
                            onChange={(e) => setPercentInput(e.target.value)}
                            className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-lg font-bold focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1 font-medium">Scale Out Of (Pts)</label>
                          <input
                            type="number"
                            step="any"
                            required
                            value={targetGuidelineMax}
                            onChange={(e) => setTargetGuidelineMax(e.target.value)}
                            className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-lg font-bold focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {shouldAutoScaleCurrentEntry && calcMode === 'rescale' && (
                    <div className="p-4 rounded-2xl bg-slate-950/90 border border-slate-800 space-y-3">
                      <div className="text-xs text-slate-400">
                        Enter raw fraction below to automatically scale it out of <strong className="text-white">{targetGuidelineMax} points</strong>.
                      </div>
                      <div className="grid grid-cols-3 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1 font-medium">Raw Earned</label>
                          <input
                            type="number"
                            step="any"
                            required
                            placeholder="e.g., 18"
                            value={rawEarned}
                            onChange={(e) => setRawEarned(e.target.value)}
                            className="w-full px-3.5 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-base font-bold focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1 font-medium">Raw Out Of</label>
                          <input
                            type="number"
                            step="any"
                            required
                            placeholder="e.g., 20"
                            value={rawOutOf}
                            onChange={(e) => setRawOutOf(e.target.value)}
                            className="w-full px-3.5 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-base font-bold focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1 font-medium">Scale Out Of</label>
                          <input
                            type="number"
                            step="any"
                            required
                            value={targetGuidelineMax}
                            onChange={(e) => setTargetGuidelineMax(e.target.value)}
                            className="w-full px-3.5 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-base font-bold focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="p-4 rounded-2xl bg-indigo-950/40 border border-indigo-500/30 flex items-center justify-between">
                    <div>
                      <span className="text-xs uppercase font-bold tracking-wider text-indigo-300">Point Calculation Preview</span>
                      {calculatedPreview.valid ? (
                        <div className="text-lg font-extrabold text-white mt-0.5">
                          {calculatedPreview.earned} / {calculatedPreview.max} pts <span className="text-indigo-300 text-sm font-semibold">({calculatedPreview.percent}%)</span>
                        </div>
                      ) : (
                        <div className="text-xs text-slate-400 mt-0.5">Enter score values above...</div>
                      )}
                    </div>
                    {calculatedPreview.valid && stats && (
                      <div className="text-right">
                        <span className="text-xs text-slate-400 block">Letter Grade</span>
                        <span className="text-xl font-black text-white">{getLetterGradeInfo(calculatedPreview.percent, stats.activeCutoffs).letter}</span>
                      </div>
                    )}
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsAddEntryOpen(false)}
                      className="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={!calculatedPreview.valid}
                      className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition"
                    >
                      {editingEntry ? 'Save Changes' : 'Add to Gradebook'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* EDIT SUBJECT MODAL */}
          {isSubjectModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 md:p-7 shadow-2xl space-y-5 my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div>
                    <h3 className="text-xl font-bold text-white">Subject &amp; Syllabus Settings</h3>
                    <p className="text-xs text-slate-400 mt-0.5">Configure AP Stats weighting (85/10/5) and assessment point scaling.</p>
                  </div>
                  <button
                    onClick={() => setIsSubjectModalOpen(false)}
                    className="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveSubject} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Subject Name</label>
                    <input
                      type="text"
                      required
                      value={subjName}
                      onChange={(e) => setSubjName(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white font-semibold text-sm"
                    />
                  </div>

                  <label className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 flex items-center gap-3.5 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={subjUseWeighted}
                      onChange={(e) => setSubjUseWeighted(e.target.checked)}
                      className="sr-only"
                    />
                    <div className={`w-6 h-6 rounded-lg flex items-center justify-center border shrink-0 ${subjUseWeighted ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-transparent'}`}>
                      <Check className="w-4 h-4 stroke-[3]" />
                    </div>
                    <div className="text-xs">
                      <div className="font-bold text-white text-sm">Use AP Stats Weighted View (85% Assessments / 10% Take-Home / 5% EFFL)</div>
                      <div className="text-slate-400 mt-0.5">Uncheck to use Overall Objective Percentage.</div>
                    </div>
                  </label>

                  <label className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 flex items-center gap-3.5 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={subjUseGuidelines}
                      onChange={(e) => setSubjUseGuidelines(e.target.checked)}
                      className="sr-only"
                    />
                    <div className={`w-6 h-6 rounded-lg flex items-center justify-center border shrink-0 ${subjUseGuidelines ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-transparent'}`}>
                      <Check className="w-4 h-4 stroke-[3]" />
                    </div>
                    <div className="text-xs">
                      <div className="font-bold text-white text-sm">Enable Auto-Scaling Point Guidelines for Tests &amp; Quizzes</div>
                      <div className="text-slate-400 mt-0.5">Includes &ldquo;Other&rdquo; for unscaled assignments.</div>
                    </div>
                  </label>

                  {subjUseGuidelines && (
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Default Point Scaling Guidelines</label>
                      <div className="grid grid-cols-3 gap-2.5 mt-2">
                        <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800">
                          <label className="block text-[11px] font-bold text-rose-400 mb-1">Test (Pts)</label>
                          <input
                            type="number"
                            step="any"
                            required
                            value={guidelineTest}
                            onChange={(e) => setGuidelineTest(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold text-sm"
                          />
                        </div>
                        <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800">
                          <label className="block text-[11px] font-bold text-indigo-400 mb-1">Quiz (Pts)</label>
                          <input
                            type="number"
                            step="any"
                            required
                            value={guidelineQuiz}
                            onChange={(e) => setGuidelineQuiz(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold text-sm"
                          />
                        </div>
                        <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800">
                          <label className="block text-[11px] font-bold text-emerald-400 mb-1">Take-Home (Pts)</label>
                          <input
                            type="number"
                            step="any"
                            required
                            value={guidelineAssignment}
                            onChange={(e) => setGuidelineAssignment(e.target.value)}
                            className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold text-sm"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  <label className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 flex items-center gap-3.5 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={subjUse85}
                      onChange={(e) => setSubjUse85(e.target.checked)}
                      className="sr-only"
                    />
                    <div className={`w-6 h-6 rounded-lg flex items-center justify-center border shrink-0 ${subjUse85 ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-transparent'}`}>
                      <Check className="w-4 h-4 stroke-[3]" />
                    </div>
                    <div className="text-xs">
                      <div className="font-bold text-white text-sm">Use 85% A- Grade Bounds (A- = 85%, B- = 75%, C- = 65%)</div>
                    </div>
                  </label>

                  <div className="flex items-center justify-end gap-3 pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setIsSubjectModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-sm font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold shadow-lg shadow-indigo-600/25"
                    >
                      Save Settings
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* SCALE CUTOFFS MODAL */}
          {isScaleModalOpen && activeSubject && stats && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 md:p-7 shadow-2xl space-y-5 my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div>
                    <h3 className="text-xl font-bold text-white">Grade Bounds &amp; Cutoffs</h3>
                    <p className="text-xs text-slate-400 mt-0.5">Switch between 85% A- scale and Standard 90% scale.</p>
                  </div>
                  <button onClick={() => setIsScaleModalOpen(false)} className="p-2.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={() => handleToggle85Scale(true)}
                    className={`p-3.5 rounded-2xl border text-left transition ${activeSubject.use85Scale ? 'bg-indigo-600/20 border-indigo-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-400'}`}
                  >
                    <div className="font-bold text-sm">85% A- Scale (10-pt bounds)</div>
                  </button>
                  <button
                    type="button"
                    onClick={() => handleToggle85Scale(false)}
                    className={`p-3.5 rounded-2xl border text-left transition ${!activeSubject.use85Scale ? 'bg-indigo-600/20 border-indigo-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-400'}`}
                  >
                    <div className="font-bold text-sm">Standard 90% A- Scale</div>
                  </button>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setIsScaleModalOpen(false)} className="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm">Done</button>
                </div>
              </div>
            </div>
          )}

          {/* WHAT-IF CALCULATOR MODAL */}
          {isWhatIfOpen && activeSubject && stats && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 md:p-7 shadow-2xl space-y-6 my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div className="flex items-center gap-2.5">
                    <Sparkles className="w-6 h-6 text-amber-400" />
                    <div>
                      <h3 className="text-xl font-bold text-white">What-If Grade Calculator</h3>
                      <p className="text-xs text-slate-400">Simulate upcoming scores in {activeSubject.useWeightedView ? 'Weighted Syllabus View' : 'Objective Total Points'}.</p>
                    </div>
                  </div>
                  <button onClick={() => setIsWhatIfOpen(false)} className="p-2.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                  {(['Test', 'Quiz', 'Assignment']).map((cat) => {
                    const pts = activeSubject.guidelines?.[cat] ?? (cat === 'Test' ? 60 : cat === 'Quiz' ? 30 : 10);
                    const active = whatIfCategory === cat;
                    return (
                      <button
                        key={cat}
                        type="button"
                        onClick={() => {
                          setWhatIfCategory(cat);
                          setWhatIfMaxPoints(String(pts));
                          setWhatIfHypotheticalEarned(String(roundToTwo(pts * 0.9)));
                        }}
                        className={`p-3 rounded-2xl border text-left transition ${active ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-950 border-slate-800 text-slate-300'}`}
                      >
                        <div className="font-bold text-xs">Next {cat}</div>
                        <div className="text-sm font-extrabold mt-0.5">Out of {pts} pts</div>
                      </button>
                    );
                  })}
                </div>
                <div className="grid grid-cols-2 gap-4 p-4 rounded-2xl bg-slate-950 border border-slate-800">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1 font-medium">Hypothetical Earned</label>
                    <input
                      type="number"
                      step="any"
                      value={whatIfHypotheticalEarned}
                      onChange={(e) => setWhatIfHypotheticalEarned(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold text-lg"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1 font-medium">Upcoming Max Points</label>
                    <input
                      type="number"
                      step="any"
                      value={whatIfMaxPoints}
                      onChange={(e) => setWhatIfMaxPoints(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-bold text-lg"
                    />
                  </div>
                </div>
                {(() => {
                  const hypE = parseFloat(whatIfHypotheticalEarned) || 0;
                  const hypM = parseFloat(whatIfMaxPoints) || 0;
                  const simulatedSubj = {
                    ...activeSubject,
                    entries: [
                      ...(activeSubject.entries || []),
                      { id: 'temp-whatif', category: whatIfCategory, earnedPoints: hypE, maxPoints: hypM }
                    ]
                  };
                  const simStats = calculateSubjectStanding(simulatedSubj);
                  const newPct = simStats?.overallPercent ?? null;
                  const newGrade = getLetterGradeInfo(newPct, stats.activeCutoffs);

                  return (
                    <div className="p-5 rounded-2xl bg-indigo-950/40 border border-indigo-500/30 flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-indigo-300">Projected New Average</span>
                        <div className="text-2xl font-black text-white mt-1">
                          {newPct !== null ? `${newPct}%` : '—'} <span className="text-xs font-normal text-slate-300">(Objective: {simStats?.objectivePercent ?? '—'}%)</span>
                        </div>
                      </div>
                      <div className={`w-16 h-16 rounded-2xl border flex items-center justify-center text-2xl font-black ${newGrade.bg} ${newGrade.color}`}>
                        {newGrade.letter}
                      </div>
                    </div>
                  );
                })()}
                <div className="flex justify-end">
                  <button onClick={() => setIsWhatIfOpen(false)} className="px-6 py-2.5 rounded-xl bg-slate-800 text-white font-semibold text-sm">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
